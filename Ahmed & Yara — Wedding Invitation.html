<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed &amp; Yara · Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#fff;--bg:#060103;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;overflow:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
.stage{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#3d0812 0,#16040b 55%,#060103 100%)}
.cone,.fog,.sp{position:absolute;pointer-events:none}
.cone{inset:0;opacity:0;background:conic-gradient(at 50% -4%,transparent 158deg,rgba(255,205,195,.16) 172deg,rgba(255,235,228,.3) 180deg,rgba(255,205,195,.16) 188deg,transparent 202deg);animation:fade 2.4s .8s forwards,flick 5s 3.2s ease-in-out infinite alternate}
.fog{left:-20%;bottom:0;width:140%;height:42%;opacity:0;filter:blur(16px);background:radial-gradient(ellipse at 28% 65%,rgba(255,175,165,.4),transparent 62%),radial-gradient(ellipse at 76% 70%,rgba(200,60,75,.4),transparent 62%);animation:fade 2.4s .8s forwards,drift 14s 3.2s ease-in-out infinite alternate}
.sp{inset:0;opacity:0;animation:fade 2s .8s forwards}
.sp i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #ffc9c0;opacity:0;animation:tw 4s ease-in-out infinite}
.wrap{position:relative;z-index:2;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.t{text-align:center;padding:3.5vh 16px 0}
.t>*{margin:0;opacity:0;animation:rise 1.4s ease forwards;animation-delay:calc(1.6s + var(--d) * .35s)}
.s{font:italic 600 clamp(14px,min(4.4vw,2.6vh),20px)/1.35 'Cormorant Garamond',Georgia,serif;color:#ffe9e4;letter-spacing:.03em}
.n{font:400 clamp(46px,min(17vw,9.2vh),86px)/1.02 'Great Vibes','Snell Roundhand','Brush Script MT',cursive;text-shadow:0 0 10px rgba(255,255,255,.75),0 0 28px rgba(255,120,120,.55)}
.a{font-size:clamp(26px,min(9vw,5vh),44px)}
.d{display:flex;align-items:center;justify-content:center;gap:14px;margin:1.2vh 0;font:600 clamp(18px,min(5.4vw,3vh),24px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.26em;text-shadow:0 0 12px rgba(255,200,190,.7)}
.d::before,.d::after{content:"";width:9vw;max-width:46px;height:1px;background:linear-gradient(90deg,transparent,#ffd6cf)}
.d::after{transform:scaleX(-1)}
.couple{position:relative;flex:1;min-height:0;margin-top:1vh;opacity:0;animation:rise 1.8s ease .7s forwards}
.cp{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 14px rgba(255,150,140,.45))}
.pair{transform-origin:160px 345px;animation:sway 3.4s ease-in-out infinite alternate}
.br{transform-origin:128px 345px;animation:turn 3.4s ease-in-out infinite alternate}
.sk{transform-origin:128px 172px;animation:skw 1.7s ease-in-out infinite alternate}
.gr{transform-origin:208px 340px;animation:bob 1.7s ease-in-out infinite alternate}
.c{position:fixed;top:0;bottom:0;width:50%;z-index:5;background:repeating-linear-gradient(90deg,#4a0006 0,#a8000f 5%,#d1121f 9%,#8a000c 14%,#3b0004 20%);box-shadow:inset 0 0 60px rgba(0,0,0,.5),0 0 40px rgba(0,0,0,.7);animation:op 2.8s cubic-bezier(.7,0,.3,1) forwards}
.c::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.65),transparent 28%,transparent 72%,rgba(0,0,0,.55))}
.c.l{left:0;transform-origin:left}
.c.r{right:0;transform-origin:right}
@keyframes op{to{transform:scaleX(.2)}}
@keyframes fade{to{opacity:1}}
@keyframes flick{from{opacity:.7}to{opacity:1}}
@keyframes drift{to{transform:translateX(6%) scale(1.08)}}
@keyframes tw{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:1;transform:translateY(-14px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg) translateY(-6px)}}
@keyframes turn{to{transform:scaleX(.9)}}
@keyframes skw{from{transform:skewX(-5deg)}to{transform:skewX(5deg) scaleX(1.03)}}
@keyframes bob{to{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
body:not(.go) *:not(.hint){animation-play-state:paused!important}
.c{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hint{position:fixed;left:0;right:0;top:50%;z-index:6;text-align:center;pointer-events:none;font:italic 600 clamp(18px,5vw,22px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:#ffe9e4;text-shadow:0 0 12px rgba(255,200,190,.85);animation:pulse 1.8s ease-in-out infinite}
.go .hint{animation:hide .5s forwards}
@keyframes pulse{50%{opacity:.3}}
@keyframes hide{to{opacity:0}}
</style>
</head>

<script>
(function(){
var sp=document.querySelector('.sp');
for(var i=0;i<70;i++){var e=document.createElement('i'),s=1+Math.random()*3;e.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;animation-delay:'+Math.random()*6+'s;animation-duration:'+(3+Math.random()*4)+'s';sp.appendChild(e)}
var done=0,C=window.AudioContext||window.webkitAudioContext;
function play(){
 var el=document.getElementById('mp3');
 if(!el){addEventListener('load',play,{once:true});return}
 var x;try{x=C&&new C();x&&x.resume()}catch(e){}
 try{
  var b=atob(el.textContent.trim()),u=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  var a=new Audio(URL.createObjectURL(new Blob([u],{type:'audio/mpeg'})));a.loop=true;
  var fb=function(){if(!x||fb.d)return;fb.d=1;x.decodeAudioData(u.buffer,function(d){var n=x.createBufferSource();n.buffer=d;n.loop=true;n.connect(x.destination);n.start(0)})};
  a.onerror=fb;var p=a.play();
  if(p&&p.then)p.then(function(){fb.d=1;try{x&&x.close()}catch(e){}},fb)
 }catch(e){}
}
function open(){if(done)return;done=1;document.body.classList.add('go');play()}
document.querySelectorAll('.c').forEach(function(c){c.addEventListener('click',open)});
})();
</script>
